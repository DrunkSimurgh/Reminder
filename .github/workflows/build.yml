name: Build Reminder

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Lazarus
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: "stable"
          with-cache: false

      - name: Show Lazarus version
        shell: pwsh
        run: lazbuild --version

      - name: Build project
        shell: pwsh
        run: |
          lazbuild -B --bm=Release src/reminder.lpi

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: reminder-windows
          path: build/reminder.exe

  build-ubuntu-linux:
    name: Build Ubuntu Linux executable
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Lazarus
        run: |
          sudo apt-get update
          sudo apt-get install -y lazarus

      - name: Build project
        run: |
          lazbuild -B --bm=Release src/reminder.lpi

      - name: Upload Ubuntu Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: reminder-ubuntu-linux
          path: build/reminder

  build-rocky-linux:
    name: Build Rocky Linux executable
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9

    steps:
      - name: Install build tools
        run: |
          dnf -y update
          dnf -y install epel-release
          dnf -y install git make gcc fpc lazarus

      - name: Check out source
        uses: actions/checkout@v4

      - name: Build project
        run: |
          lazbuild -B --bm=Release src/reminder.lpi

      - name: Upload Rocky Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: reminder-rocky-linux-9
          path: build/reminder
